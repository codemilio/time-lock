[package]
name = "time-lock"
version = "0.1.0"
description = "Cápsula do Tempo — mensagens cifradas para o seu eu do futuro"
authors = ["Carlos Silva"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "time_lock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
rand = "0.10.3"
zeroize = { version = "1.9.1", features = ["derive"] }
thiserror = "2.0.21"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
